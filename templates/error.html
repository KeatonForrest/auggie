{% extends "base.html" %}

{% block title %}{{ title }} - Auggie{% endblock %}

{% block layout %}
<div class="max-w-xl mx-auto py-16 text-center">
    <div class="text-6xl font-bold text-gray-300 mb-4">{{ status_code }}</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">{{ title }}</h1>
    <p class="text-gray-600 mb-6">{{ detail }}</p>
    {% if status_code == 402 %}
    <p class="text-sm text-gray-500 mb-6">If you were charged a credit, it has been refunded.</p>
    {% endif %}
    <div class="flex justify-center gap-3">
        <a href="/" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Go Home</a>
        <a href="mailto:support@auggie.app" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium">Contact Support</a>
    </div>
</div>
{% endblock %}
