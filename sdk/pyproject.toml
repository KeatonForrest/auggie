[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auggie"
version = "0.2.0"
description = "Python SDK for the Auggie account research API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://auggie.tools"
Documentation = "https://auggie.tools/docs"
